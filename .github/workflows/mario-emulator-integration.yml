name: Mario Double DQN Emulator Integration

on:
  workflow_dispatch:

jobs:
  mario-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10 (tutorial-compatible legacy stack)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: projects/mario_double_dqn/requirements-mario.txt

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install numpy==1.26.4
          python -m pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu

      - name: Install tutorial Mario environment
        run: |
          python -m pip install gym==0.26.2 gym-super-mario-bros==7.4.0 nes-py==8.2.1 Pillow==10.4.0

      - name: Verify real NES emulator reset and step
        working-directory: projects/mario_double_dqn
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python code/smoke_test.py --steps 2

      - name: Train a short real-environment Double DQN run
        working-directory: projects/mario_double_dqn
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          python code/train.py \
            --episodes 100 \
            --max-steps 256 \
            --seed 42 \
            --replay-capacity 2048 \
            --batch-size 32 \
            --burnin 128 \
            --learn-every 3 \
            --sync-every 1000 \
            --epsilon-decay 0.9995 \
            --checkpoint-dir checkpoints/mario-integration \
            --replay-dir replay_memory/mario-integration

      - name: Evaluate the saved policy without exploration
        working-directory: projects/mario_double_dqn
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          python code/evaluate.py \
            --checkpoint checkpoints/mario-integration/best_mario_double_dqn.pt \
            --episodes 10 \
            --max-steps 256 \
            --seed 10042 \
            --output evaluation/mario-integration.csv

      - name: Upload real-environment training and evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mario-double-dqn-integration-evidence
          path: |
            projects/mario_double_dqn/checkpoints/mario-integration/training_metrics.csv
            projects/mario_double_dqn/checkpoints/mario-integration/best_mario_double_dqn.pt
            projects/mario_double_dqn/checkpoints/mario-integration/latest_mario_double_dqn.pt
            projects/mario_double_dqn/evaluation/mario-integration.csv
          if-no-files-found: warn
          retention-days: 30
