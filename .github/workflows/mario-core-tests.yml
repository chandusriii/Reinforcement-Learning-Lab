name: Mario Double DQN Core Tests

on:
  push:
    paths:
      - "projects/mario_double_dqn/**"
      - ".github/workflows/mario-core-tests.yml"
  pull_request:
    paths:
      - "projects/mario_double_dqn/**"
      - ".github/workflows/mario-core-tests.yml"

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4
          python -m pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile project modules
        working-directory: projects/mario_double_dqn
        run: python -m compileall -q code
      - name: Run Mario core unit tests
        working-directory: projects/mario_double_dqn
        run: python code/test_core.py
